<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Banco de Preguntas Basica I 🌟</title>
    <style>
        body {
            background: linear-gradient(135deg, #e9dcf1 0%, #f7e1eb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #4a4a4a;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* ☀️ SOLES DECORATIVOS EN LAS ESQUINAS DEL FONDO ☀️ */
        .sol-fondo {
            position: absolute;
            font-size: 3.5rem;
            color: #f6e08c;
            opacity: 0.25;
            z-index: 1;
            user-select: none;
        }
        .sol-top-left { top: 15px; left: 15px; }
        .sol-bottom-right { bottom: 15px; right: 15px; }

        .tower_container {
            background-color: rgba(255, 255, 255, 0.96);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 3px solid #f9f0ca;
            box-sizing: border-box;
            position: relative;
            z-index: 5; /* Por encima de los soles del fondo */
        }

        /* 🎭 Estilos del Personaje 🎭 */
        .personaje_integrado {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #e9dcf1;
            padding-bottom: 15px;
        }

        .img_personaje {
            width: 95px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.1));
        }

        .rapunzel_dialogo {
            background-color: #fbf4f8;
            color: #6a4c9c;
            font-weight: bold;
            font-size: 0.88em;
            padding: 12px 15px;
            border-radius: 12px;
            text-align: center;
            line-height: 1.4;
            width: 100%;
            box-sizing: border-box;
            word-wrap: break-word;
        }

        /* 🏥 Título y Botones 🏥 */
        h1 {
            color: #6a4c9c;
            font-family: 'Georgia', serif;
            margin: 0 0 5px 0;
            font-size: 1.5em;
        }

        .subtitulo {
            color: #d88fb5;
            font-size: 0.85em;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .btn_comenzar {
            display: inline-block;
            background-color: #6a4c9c;
            color: white;
            padding: 12px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(106, 76, 156, 0.2);
        }

        .btn_comenzar:hover {
            background-color: white;
            color: #6a4c9c;
            border: 2px solid #6a4c9c;
            transform: translateY(-2px);
        }

        /* ☀️ SOL PEQUEÑO EN EL PIE DE PÁGINA ☀️ */
        .footer-decoracion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            color: #f6e08c;
            font-size: 1.2rem;
        }

        .footer {
            margin-top: 10px;
            font-size: 0.8em;
            color: #8c8c8c;
            border-top: 1px solid #e9dcf1;
            padding-top: 10px;
        }

        .btn_reset {
            color: #a694bf;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 0.9em;
            padding: 5px;
        }
        
        .btn_reset:hover {
            color: #d88fb5;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="sol-fondo sol-top-left">☀️</div>
    <div class="sol-fondo sol-bottom-right">☀️</div>

<div class="tower_container">

    {% if personaje_actual %}
    <div class="personaje_integrado">
        <img src="{{ imagen_personaje }}" alt="{{ personaje_actual }}" class="img_personaje">
        <div class="rapunzel_dialogo">{{ mensaje_actual }}</div>
    </div>
    {% endif %}

    <h1>🏥 Banco de Preguntas Basica I</h1>
    <p class="subtitulo">¡Prepárate para brillar! 🌟</p>
    
    <a href="{{ url_for('quiz') }}" class="btn_comenzar">¡Comenzar Cuestionario!</a>
    <a href="{{ url_for('iniciar_examen') }}" class="btn_comenzar" style="background-color: #d88fb5; box-shadow: 0 4px 10px rgba(216, 143, 181, 0.2);">Examen de la Torre! ⏱️</a>

    <div class="footer-decoracion">
        <span>✨</span>
        <span>☀️</span>
        <span>✨</span>
    </div>

    <div class="footer">
        <button onclick="window.location.href='{{ url_for('reset') }}'" class="btn_reset">Reiniciar progreso</button>
    </div>
</div>

</body>
</html>
